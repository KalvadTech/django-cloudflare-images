<div class="ci-widget" data-upload-endpoint="{{widget.upload_endpoint}}" data-signed="{% if widget.signed %}true{% else %}false{% endif %}">
  {% if widget.value %}
  <div><a href="{{ widget.url }}" target="_blank">Current image</a></div>
  {% endif %}
  <input type="file"{{ widget.file_attrs }}>
  <input type="hidden" id="{{ widget.hidden_id }}" name="{{widget.name}}" value="{{ widget.value|default_if_none:'' }}">
  <button type="button"{% if widget.button_disabled %} disabled{% endif %}>Upload</button>
  <p class="ci-widget-error" id="{{ widget.error_id }}" role="alert" aria-live="polite"></p>
</div>
