[tox]
envlist =
    clean
    py310-django3
    py{310,311,312}-django4
    py{310,311,312,313,314}-django5
    py{312,313,314}-django60
    py{312,313,314,315}-django61
skip_missing_interpreters = true

[gh-actions]
python =
    3.10: py310-django3, py310-django4, py310-django5
    3.11: py311-django4, py311-django5
    3.12: py312-django4, py312-django5, py312-django60, py312-django61
    3.13: py313-django5, py313-django60, py313-django61
    3.14: py314-django5, py314-django60, py314-django61
    3.15: py315-django61

[testenv]
deps =
    pytest
    pytest-cov
    django3: django~=3.2
    django4: django~=4.2
    django5: django~=5.2
    django60: django>=6.0,<6.1
    django61: django~=6.1.3
setenv =
    DJANGO_SETTINGS_MODULE = {env:DJANGO_SETTINGS_MODULE:tests.settings}
    django3: DJANGO_SETTINGS_MODULE = tests.settings
    django4: DJANGO_SETTINGS_MODULE = tests.settings_django_4_2
    django5: DJANGO_SETTINGS_MODULE = tests.settings_django_4_2
    django60: DJANGO_SETTINGS_MODULE = tests.settings_django_4_2
    django61: DJANGO_SETTINGS_MODULE = tests.settings_django_4_2
commands = pytest --cov=cloudflare_images --cov-append --cov-report=term-missing

[testenv:clean]
deps =
    coverage
skip_install = true
commands = coverage erase
